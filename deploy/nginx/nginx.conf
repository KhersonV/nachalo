server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://frontend:3000;
    }

    location /ws {
        proxy_pass http://gameservice:8001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /auth/ {
        proxy_pass http://auth:8000;
    }

    # frontend page
    location = /game {
        proxy_pass http://frontend:3000;
    }

    # frontend page after redirect/trailing slash
    location = /game/ {
        proxy_pass http://frontend:3000;
    }

	location = /game/stats {
    proxy_pass http://frontend:3000;
}

location = /game/stats/ {
    proxy_pass http://frontend:3000;
}


    # all backend game endpoints
    location ^~ /game/ {
        proxy_pass http://gameservice:8001;
    }

    location = /create/player {
        proxy_pass http://gameservice:8001/create/player;
    }

    location = /api/resources {
        proxy_pass http://gameservice:8001/api/resources;
    }

    location = /api/monsters {
        proxy_pass http://gameservice:8001/api/monsters;
    }

    location /matchmaking/ {
        proxy_pass http://matchmaking:8002;
    }

    location = /healthz/auth {
        proxy_pass http://auth:8000/healthz;
    }

    location = /healthz/game {
        proxy_pass http://gameservice:8001/healthz;
    }

    location = /healthz/matchmaking {
        proxy_pass http://matchmaking:8002/healthz;
    }
}
