server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve Docker DNS names at runtime (prevents stale cached IPs)
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    location / {
        set $upstream "frontend:3000";
        proxy_pass http://$upstream$request_uri;
    }

    location /ws {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /auth/ {
        set $upstream "auth:8000";
        proxy_pass http://$upstream$request_uri;
    }

    # frontend page
    location = /game {
        set $upstream "frontend:3000";
        proxy_pass http://$upstream$request_uri;
    }

    # frontend page after redirect/trailing slash
    location = /game/ {
        set $upstream "frontend:3000";
        proxy_pass http://$upstream$request_uri;
    }

    location = /game/stats {
        set $upstream "frontend:3000";
        proxy_pass http://$upstream$request_uri;
    }

    location = /game/stats/ {
        set $upstream "frontend:3000";
        proxy_pass http://$upstream$request_uri;
    }


    # all backend game endpoints
    location ^~ /game/ {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream$request_uri;
    }

    location = /create/player {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream/create/player;
    }

    location = /api/resources {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream/api/resources;
    }

    location = /api/monsters {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream/api/monsters;
    }

    location /matchmaking/ {
        set $upstream "matchmaking:8002";
        proxy_pass http://$upstream$request_uri;
    }

    location = /healthz/auth {
        set $upstream "auth:8000";
        proxy_pass http://$upstream/healthz;
    }

    location = /healthz/game {
        set $upstream "gameservice:8001";
        proxy_pass http://$upstream/healthz;
    }

    location = /healthz/matchmaking {
        set $upstream "matchmaking:8002";
        proxy_pass http://$upstream/healthz;
    }
}
