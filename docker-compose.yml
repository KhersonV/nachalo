
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: ./docker/auth.Dockerfile
    container_name: auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8000
      AUTH_DB_DSN: ${AUTH_DB_DSN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  gameservice:
    build:
      context: .
      dockerfile: ./docker/gameservice.Dockerfile
    container_name: gameservice
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8001
      GAME_DB_DSN: ${GAME_DB_DSN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  matchmaking:
    build:
      context: .
      dockerfile: ./docker/matchmaking.Dockerfile
    container_name: matchmaking
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8002
      GAME_SERVICE_URL: http://gameservice:8001
      GAME_DB_DSN: ${GAME_DB_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      gameservice:
        condition: service_started
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
        NEXT_PUBLIC_WS_URL: "/ws"
        NEXT_PUBLIC_AUTH_BASE: ""
        NEXT_PUBLIC_MATCHMAKING_BASE: ""
    container_name: frontend
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      gameservice:
        condition: service_started
      matchmaking:
        condition: service_started
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      auth:
        condition: service_started
      gameservice:
        condition: service_started
      matchmaking:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge