
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      APP_DB_USER: admin
      APP_DB_PASSWORD: admin
      AUTH_DB_NAME: admin
      GAME_DB_NAME: game_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres/bootstrap/ensure-databases.sh:/usr/local/bin/ensure-databases.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ensure-databases.sh"]
    networks:
      - app_net

  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NACHALO_ADMINER_PORT:-8080}:8080"
    networks:
      - app_net

  auth:
    build:
      context: .
      dockerfile: ./docker/auth.Dockerfile
    restart: unless-stopped
    env_file:
      - ${NACHALO_ENV_FILE:-.env}
    environment:
      PORT: 8000
      AUTH_DB_DSN: ${AUTH_DB_DSN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      gameservice:
        condition: service_healthy
    networks:
      - app_net

  gameservice:
    build:
      context: .
      dockerfile: ./docker/gameservice.Dockerfile
    restart: unless-stopped
    env_file:
      - ${NACHALO_ENV_FILE:-.env}
    environment:
      PORT: 8001
      NACHALO_COMBAT_RULESET: ${NACHALO_COMBAT_RULESET:-experimental_v34}
      NACHALO_COMBAT_SEED: ${NACHALO_COMBAT_SEED:-}
      EQUIPMENT_DROP_CHANCE_OVERRIDE: ${EQUIPMENT_DROP_CHANCE_OVERRIDE:-10}
      BARREL_ARTIFACT_CHANCE_PERCENT: ${BARREL_ARTIFACT_CHANCE_PERCENT:-4}
      GAME_DB_DSN: ${GAME_DB_DSN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8001/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_net

  matchmaking:
    build:
      context: .
      dockerfile: ./docker/matchmaking.Dockerfile
    restart: unless-stopped
    env_file:
      - ${NACHALO_ENV_FILE:-.env}
    environment:
      PORT: 8002
      GAME_SERVICE_URL: http://gameservice:8001
      GAME_DB_DSN: ${GAME_DB_DSN}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      gameservice:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
        NEXT_PUBLIC_WS_URL: "/ws"
        NEXT_PUBLIC_AUTH_BASE: ""
        NEXT_PUBLIC_MATCHMAKING_BASE: ""
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      gameservice:
        condition: service_started
      matchmaking:
        condition: service_started
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      auth:
        condition: service_started
      gameservice:
        condition: service_started
      matchmaking:
        condition: service_started
    ports:
      - "${NACHALO_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

volumes:
  postgres_data:

networks:
  app_net:
    driver: bridge
